name: Aggiorna notizie

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installa dipendenze
        run: npm ci

      - name: Scarica ed elabora i feed
        run: npm run fetch-news

      - name: Commit e push se ci sono novità
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "Nessuna novità, salto il commit."
          else
            git add data/news.json
            git commit -m "chore: aggiorna notizie [skip ci]"
            git push
          fi
